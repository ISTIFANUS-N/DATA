<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/stefanx-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1F7A34" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('stx_theme');
          var dark = t === 'dark'; // light until the user chooses dark mode
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <style>
      /* Short launch animation, shown only when opened as an installed app. */
      #stx-splash { display: none; position: fixed; inset: 0; z-index: 99999; background: #fff;
        flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
      html.splash-on #stx-splash { display: flex; animation: stx-out .4s ease 1.55s forwards; }
      #stx-splash img { width: min(80vw, 420px); height: auto; opacity: 0;
        animation: stx-pop .7s cubic-bezier(.2, .9, .3, 1.15) .05s forwards; }
      #stx-splash .bar { width: min(46vw, 200px); height: 4px; border-radius: 4px; background: #e3eee5; overflow: hidden; }
      #stx-splash .bar i { display: block; height: 100%; background: linear-gradient(90deg, #166029, #fbb03b);
        transform: scaleX(0); transform-origin: left; animation: stx-fill .9s ease-in-out .55s forwards; }
      @keyframes stx-pop { from { opacity: 0; transform: scale(.82) translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes stx-fill { to { transform: scaleX(1); } }
      @keyframes stx-out { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #stx-splash img { animation: stx-fade .3s ease forwards; transform: none; }
        #stx-splash .bar { display: none; }
        @keyframes stx-fade { to { opacity: 1; } }
      }
    </style>
    <script>
      (function () {
        try {
          var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
          if (standalone && !sessionStorage.getItem('stx_splash')) {
            sessionStorage.setItem('stx_splash', '1');
            document.documentElement.classList.add('splash-on');
          }
        } catch (e) {}
      })();
    </script>
    <title>Stefanx Data Services — Airtime, Data, Bills & More</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-paper text-ink font-body">
    <div id="stx-splash" aria-hidden="true">
      <img src="%sveltekit.assets%/stefanx-full-logo.png" alt="" />
      <div class="bar"><i></i></div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
    <!-- Monnify payment SDK — required for wallet funding -->
    <script src="https://sdk.monnify.com/plugin/monnify.js"></script>
</html>
